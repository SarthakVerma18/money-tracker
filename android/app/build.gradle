plugins {
    id 'com.android.application'
}

// Signing config is read from ~/.money-tracker/keystore.properties (never committed).
def ksFile = new File(System.getProperty('user.home'), '.money-tracker/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'app.moneytracker'
    compileSdk 35

    defaultConfig {
        applicationId 'app.moneytracker'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/webassets"
    }
}

// Bundle the web app (one level up) into the APK's assets.
tasks.register('copyWebApp', Copy) {
    from('../..') {
        include 'index.html', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'icon-maskable.png'
    }
    into "$buildDir/webassets"
}
preBuild.dependsOn 'copyWebApp'

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
